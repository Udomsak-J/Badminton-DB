<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เปิดรอบตีแบด</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Helvetica Neue", "Segoe UI", "Noto Sans Thai", sans-serif;
    background: #f4f6f8; color: #1a1a1a; padding: 20px;
  }
  .card { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    width: 100%; margin-top: 24px; padding: 14px; border: none; border-radius: 10px;
    background: #06c755; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  button:disabled { background: #b7e6c9; cursor: not-allowed; }
  .msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 14px; display: none; }
  .msg.error { background: #fdecec; color: #c0392b; display: block; }
  .msg.success { background: #e8f8ef; color: #1f8a4c; display: block; }
  .msg.info { background: #eef4fb; color: #2d6cb0; display: block; }
  .loading { text-align: center; padding: 40px 0; color: #888; }
</style>
</head>
<body>
  <div class="card">
    <h1>🏸 เปิดรอบตีแบด</h1>
    <div class="sub">กรอกรายละเอียดแล้วกดเปิดรอบ ระบบจะแจ้งเข้ากลุ่มให้อัตโนมัติ</div>

    <div id="loading" class="loading">กำลังเชื่อมต่อ...</div>

    <form id="form" style="display:none">
      <label for="courtName">ชื่อสนาม</label>
      <input id="courtName" type="text" placeholder="เช่น สนามA" required />

      <label>เวลาเล่น</label>
      <div class="row">
        <div>
          <input id="startTime" type="time" required />
        </div>
        <div>
          <input id="endTime" type="time" required />
        </div>
      </div>

      <label for="courtFee">ค่าสนาม (บาท)</label>
      <input id="courtFee" type="number" min="0" step="1" placeholder="600" required />

      <label for="extraFee">ค่าใช้จ่ายอื่นๆ (บาท) — ไม่บังคับ</label>
      <input id="extraFee" type="number" min="0" step="1" placeholder="0" />

      <button id="submitBtn" type="submit">เปิดรอบ</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  function showMsg(text, type) {
    const el = $("msg");
    el.textContent = text;
    el.className = "msg " + type;
  }

  async function main() {
    let liffId;
    try {
      const cfgRes = await fetch("/.netlify/functions/liff-config");
      const cfg = await cfgRes.json();
      liffId = cfg.liffId;
      if (!liffId) throw new Error("ยังไม่ได้ตั้งค่า LIFF_ID บน Netlify");
    } catch (err) {
      $("loading").style.display = "none";
      showMsg("ตั้งค่าระบบไม่สมบูรณ์: " + err.message, "error");
      return;
    }

    try {
      await liff.init({ liffId });
    } catch (err) {
      $("loading").style.display = "none";
      showMsg("เชื่อมต่อ LINE ไม่สำเร็จ: " + err.message, "error");
      return;
    }

    if (!liff.isLoggedIn()) {
      liff.login();
      return; // จะรีโหลดหน้าใหม่หลังล็อกอินเสร็จ
    }

    const context = liff.getContext();
    if (!context || context.type !== "group") {
      $("loading").style.display = "none";
      showMsg(
        "กรุณาเปิดหน้านี้จากลิงก์ที่บอทส่งในกลุ่มไลน์ที่ต้องการเปิดรอบ (เปิดจากนอกกลุ่มจะไม่ทราบว่าจะเปิดรอบให้กลุ่มไหน)",
        "info"
      );
      return;
    }
    const groupId = context.groupId;

    $("loading").style.display = "none";
    $("form").style.display = "block";

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("submitBtn");
      btn.disabled = true;
      btn.textContent = "กำลังเปิดรอบ...";
      showMsg("", "");
      $("msg").className = "msg";

      try {
        const idToken = liff.getIDToken();
        const res = await fetch("/.netlify/functions/create-session-web", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            idToken,
            groupId,
            courtName: $("courtName").value,
            startStr: $("startTime").value,
            endStr: $("endTime").value,
            courtFee: $("courtFee").value,
            extraFee: $("extraFee").value,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(data.message || "เปิดรอบไม่สำเร็จ: " + (data.error || "unknown error"), "error");
          btn.disabled = false;
          btn.textContent = "เปิดรอบ";
          return;
        }

        showMsg("✅ เปิดรอบเรียบร้อย! ระบบแจ้งเข้ากลุ่มแล้ว ปิดหน้านี้ได้เลย", "success");
        btn.textContent = "เปิดรอบแล้ว";
        setTimeout(() => liff.closeWindow(), 1500);
      } catch (err) {
        showMsg("เกิดข้อผิดพลาด: " + err.message, "error");
        btn.disabled = false;
        btn.textContent = "เปิดรอบ";
      }
    });
  }

  main();
</script>
</body>
</html>
